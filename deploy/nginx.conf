server {
    listen 80;
    server_name __APP_HOST__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): a client-supplied X-Forwarded-For must never reach the app, or it could fake its IP and dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name __API_HOST__;

    # API allows 16 files x 8MB per multipart request (plugins/multipart.ts); keep headroom above that.
    client_max_body_size 140m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): a client-supplied X-Forwarded-For must never reach the app, or it could fake its IP and dodge rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
