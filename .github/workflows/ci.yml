name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:db
      - run: npm run typecheck
      - name: API security tests
        run: npm test --workspace=services/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          OWM_API_KEY: ci
      - name: Build API
        run: npm run build --workspace=services/api
      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          # Placeholder: only used if a page touches Prisma at build time; no connection is required to compile.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
