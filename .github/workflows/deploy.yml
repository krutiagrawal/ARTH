name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:db
      - name: API security tests
        run: npm test --workspace=services/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          OWM_API_KEY: ci
      - run: npm run build --workspace=services/api
      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Package release
        run: |
          rm -rf apps/web/.next/cache
          tar -czf release.tar.gz \
            deploy package.json package-lock.json \
            apps/mobile/package.json \
            packages/db/package.json packages/db/tsconfig.json packages/db/prisma packages/db/dist \
            services/api/package.json services/api/tsconfig.json services/api/dist services/api/public services/api/scripts services/api/src \
            apps/web/package.json apps/web/next.config.js apps/web/.next $(test -d apps/web/public && echo apps/web/public)

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Normalise the pasted key: strip CRs and make sure it ends with exactly one newline.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "SSH_KEY secret is not a valid private key"; exit 1; }
          ssh-keyscan -H "13.235.206.230" >> ~/.ssh/known_hosts

      - name: Upload and release
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ubuntu@13.235.206.230"
          scp -i ~/.ssh/id_deploy release.tar.gz ubuntu@13.235.206.230:/srv/arth/releases/${{ github.sha }}.tar.gz
          # release.sh lives inside the tarball; extract just it first so the script itself is always the newest version.
          $SSH "tar -xzf /srv/arth/releases/${{ github.sha }}.tar.gz -C /tmp deploy/release.sh && bash /tmp/deploy/release.sh ${{ github.sha }}"
